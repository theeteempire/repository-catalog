name: Update PS5 repository catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "convert.py"
      - ".github/workflows/update-catalog.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: update-ps5-repository-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install icon optimizer
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Validate converter syntax
        run: python -m py_compile convert.py

      - name: Generate catalog, direct payload URLs, and icons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python convert.py

      - name: Validate generated JSON and direct payload links
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          repos = json.loads(Path("repositories.json").read_text(encoding="utf-8"))
          feed = json.loads(Path("payloads_v2.json").read_text(encoding="utf-8"))
          icons = json.loads(Path("icons.json").read_text(encoding="utf-8"))

          assert isinstance(repos.get("repositories"), list) and repos["repositories"], "Empty repository index"
          assert repos.get("icons_url") == "https://theeteempire.github.io/ps5-repository-catalog/icons.json", "Repository index must reference the absolute published icon URL"
          assert isinstance(feed.get("payloads"), list) and feed["payloads"], "Empty payload feed"
          icon_map = icons.get("icons")
          assert isinstance(icon_map, dict), "Invalid icons map"
          assert Path("icons.json").stat().st_size < 4 * 1024 * 1024, "Icon catalog exceeds PLDMGR's 4 MiB limit"
          assert all(isinstance(v, str) and v.startswith(("data:image/png;base64,", "data:image/jpeg;base64,", "data:image/svg+xml;base64,")) and len(v) <= 12288 for v in icon_map.values()), "Icon entries must be supported data URIs no larger than 12,288 characters"
          expected_icons_url = "https://theeteempire.github.io/ps5-repository-catalog/icons.json"
          assert feed.get("icons_url") == expected_icons_url, "PLDMGR feed must reference the absolute published icons URL"
          assert len({r.get("repository_url") for r in repos["repositories"]}) == len(repos["repositories"]), "Duplicate repositories found"
          missing_repo_icons = [(r.get("name"), r.get("repository_url"), r.get("icon_key")) for r in repos["repositories"] if not r.get("icon_key") or r["icon_key"] not in icon_map]
          assert not missing_repo_icons, f"Repository entries have missing icon mappings: {missing_repo_icons[:10]}"

          bad_urls = []
          missing_icons = []
          invalid_icons = []
          for item in feed["payloads"]:
              url = item.get("url", "")
              if not isinstance(url, str) or not url.startswith("https://") or not url.split("?")[0].lower().endswith(".elf"):
                  bad_urls.append((item.get("name"), url))

              icon_key = item.get("icon_key")
              if icon_key:
                  if icon_key not in icon_map:
                      missing_icons.append((item.get("name"), icon_key))
                  elif not isinstance(icon_map[icon_key], str) or not icon_map[icon_key].startswith("data:image/"):
                      invalid_icons.append((item.get("name"), icon_key))

          if bad_urls:
              raise SystemExit(f"Non-direct/non-ELF payload URLs found: {bad_urls[:10]}")
          if missing_icons:
              raise SystemExit(f"Payload icon_key values missing from icons.json: {missing_icons[:10]}")
          if invalid_icons:
              raise SystemExit(f"Invalid icon data URIs: {invalid_icons[:10]}")

          print(f"Validated {len(repos['repositories'])} repositories, "
                f"{len(feed['payloads'])} direct ELF payloads, "
                f"{sum(bool(p.get('icon_key')) for p in feed['payloads'])} linked payload icons, "
                f"{len(icon_map)} icon entries ({Path('icons.json').stat().st_size} bytes).")
          PY

      - name: Commit and push updated catalog files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repositories.json payloads_v2.json icons.json

          if git diff --cached --quiet; then
            echo "Catalog files are unchanged."
            exit 0
          fi

          git commit -m "Update PS5 payload catalog and metadata"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
