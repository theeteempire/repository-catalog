name: Update PS5 repository catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "convert.py"
      - ".github/workflows/update-catalog.yml"

permissions:
  contents: write

concurrency:
  group: update-ps5-repository-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert upstream database
        run: python convert.py

      - name: Commit and push updated catalog files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repositories.json payloads_v2.json

          if git diff --cached --quiet; then
            echo "Catalog files are unchanged."
            exit 0
          fi

          git commit -m "Update generated PS5 repository catalog"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
